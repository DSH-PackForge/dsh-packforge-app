<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DSH PackForge</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">D</span>
        <span class="brand-name">DSH <b>PackForge</b></span>
      </div>

      <nav class="nav">
        <button data-tab="market" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/></svg>
          <span>市场</span>
        </button>
        <button data-tab="pack">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3.3 7.8 12 12.7l8.7-4.9"/><path d="M12 12.7V21"/></svg>
          <span>整合包</span>
        </button>
        <button data-tab="export">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4"/><path d="M12 3v12"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/></svg>
          <span>导出</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <span class="dot"></span>
        <span>整合包管理工具</span>
        <button id="theme-toggle" class="theme-toggle" title="切换浅色 / 深色">🌙</button>
      </div>
    </aside>

    <div class="main">
      <main>
        <!-- 市场 -->
        <section id="pane-market" class="pane">
          <div class="pane-head">
            <div>
              <h1>市场</h1>
              <p class="sub">浏览并安装社区整合包</p>
            </div>
            <button id="market-local" class="ghost">从本地加载</button>
            <button id="market-reload" class="ghost">⟳ 刷新</button>
          </div>
          <div id="market-out" class="grid"></div>
        </section>

        <!-- 导出 -->
        <section id="pane-export" class="pane" hidden>
          <div class="pane-head">
            <div>
              <h1>导出</h1>
              <p class="sub">打包 Profile 或整个 DSH_HOME</p>
            </div>
            <div class="sub-tabs">
              <button data-export-tab="profile" class="active">导出 Profile</button>
              <button data-export-tab="home">导出 DSH_HOME</button>
            </div>
          </div>

          <div id="export-profile-view">
          <div class="export-layout">
            <div class="panel form">
              <div class="field-group">
                <div class="field-group-title">Profile 来源</div>
                <div class="field">
                  <label for="export-home">DSH-HOME</label>
                  <select id="export-home" title="先选 DSH 根目录（经典 ~/.dsh 或启动器实例）"></select>
                </div>
                <div class="field">
                  <label for="export-profile">Profile</label>
                  <div class="row">
                    <select id="export-profile"></select>
                    <button id="export-refresh" class="ghost" title="重新扫描">⟳</button>
                  </div>
                </div>
              </div>

              <div class="field-group">
                <div class="field-group-title">导出形态</div>
                <div class="field">
                  <label for="export-mode">导出形态</label>
                  <select id="export-mode">
                    <option value="dspack">.dspack 单文件（分发用）</option>
                    <option value="repo">仓库（源形态，可二次开发）</option>
                  </select>
                </div>
                <div class="field" id="export-content-field" hidden>
                  <label for="export-content">仓库内容</label>
                  <select id="export-content">
                    <option value="manifest">仅清单（manifest.json）</option>
                    <option value="readme">清单 + README</option>
                    <option value="full" selected>全套文件（overrides/ + release/）</option>
                  </select>
                </div>
              </div>

              <div class="field-group">
                <div class="field-group-title">整合包信息</div>
                <div class="field">
                  <label for="export-name">整合包标识（name）</label>
                  <input id="export-name" placeholder="默认用 Profile 名（kebab-case）" />
                </div>
                <div class="field">
                  <label for="export-version">版本（version）</label>
                  <input id="export-version" placeholder="默认用 package.json 的 version" />
                </div>
                <div class="field">
                  <label for="export-display">展示名</label>
                  <input id="export-display" placeholder="默认用 Profile 名" />
                </div>
                <div class="field">
                  <label for="export-desc">描述</label>
                  <textarea id="export-desc" rows="2" placeholder="一句话介绍这个整合包（可选）"></textarea>
                </div>
                <div class="field">
                  <label for="export-author">作者</label>
                  <input id="export-author" placeholder="默认用 package.json 的 author" />
                </div>
                <div class="field">
                  <label for="export-icon">图标（icon）</label>
                  <input id="export-icon" placeholder="自动识别 icons/ 或 logo.*；也可填 URL 或归档内路径" />
                </div>
                <div class="field">
                  <label for="export-profilename">安装名（profileName）</label>
                  <input id="export-profilename" placeholder="默认用当前 Profile 名" />
                </div>
              </div>

              <div class="field-group">
                <div class="field-group-title">DSH 版本与输出</div>
                <div class="field">
                  <label for="export-dsh">DSH 版本</label>
                  <select id="export-dsh" title="钉定到已装版本；留空取最新"></select>
                </div>
                <div class="field">
                  <label for="export-out">输出目录</label>
                  <div class="row">
                    <input id="export-out" placeholder="默认当前目录" />
                    <button id="export-browse" class="ghost">浏览…</button>
                  </div>
                </div>
              </div>

              <div class="field">
                <label>特殊内容 <span class="muted">（自动识别）</span></label>
                <div id="export-special" class="special-box"><span class="muted">选择 Profile 后显示</span></div>
              </div>

              <div class="field" id="export-files-field" hidden>
                <label>包含内容 <span class="muted">（勾选要打进包的文件/目录）</span></label>
                <div class="picker-bar">
                  <label class="check"><input type="checkbox" id="export-select-all" checked /> 全选</label>
                  <span id="export-files-count" class="muted"></span>
                </div>
                <div id="export-files" class="file-picker"></div>
              </div>

              <div class="toolbar">
                <button id="export-go" class="primary">打包导出</button>
                <span id="export-busy" class="muted" hidden>正在打包…</span>
              </div>
            </div>

            <aside id="export-preview" class="panel">
              <p class="muted">选择 Profile 后显示打包预览</p>
            </aside>
          </div>

          <div id="export-result" class="result" hidden></div>
          </div><!-- /export-profile-view -->

          <div id="export-home-view" hidden>
          <div class="export-layout">
            <div class="panel form">
              <div class="field-group">
                <div class="field-group-title">DSH_HOME 来源</div>
                <div class="field">
                  <label for="home-sel">DSH_HOME</label>
                  <div class="row">
                    <select id="home-sel"></select>
                    <button id="home-refresh" class="ghost" title="重新扫描">⟳</button>
                  </div>
                </div>
              </div>

              <div class="field-group">
                <div class="field-group-title">整合包信息</div>
                <div class="field">
                  <label for="home-name">整合包标识（name）</label>
                  <input id="home-name" placeholder="kebab-case（必填）" />
                </div>
                <div class="field">
                  <label for="home-version">版本（version）</label>
                  <input id="home-version" placeholder="默认 1.0.0" />
                </div>
                <div class="field">
                  <label for="home-display">展示名</label>
                  <input id="home-display" placeholder="默认用 home 名" />
                </div>
                <div class="field">
                  <label for="home-desc">描述</label>
                  <textarea id="home-desc" rows="2" placeholder="一句话介绍这个整合包（可选）"></textarea>
                </div>
                <div class="field">
                  <label for="home-author">作者</label>
                  <input id="home-author" placeholder="可选" />
                </div>
                <div class="field">
                  <label for="home-icon">图标（icon）</label>
                  <input id="home-icon" placeholder="可选（URL 或归档内路径）" />
                </div>
                <div class="field">
                  <label for="home-default-profile">默认 Profile（defaultProfile）</label>
                  <input id="home-default-profile" placeholder="默认字母序第一个 Profile" />
                </div>
              </div>

              <div class="field-group">
                <div class="field-group-title">DSH 版本与输出</div>
                <div class="field">
                  <label for="home-dsh">DSH 版本</label>
                  <select id="home-dsh" title="钉定到已装版本；留空取最新"></select>
                </div>
                <div class="field">
                  <label for="home-out">输出目录</label>
                  <div class="row">
                    <input id="home-out" placeholder="默认当前目录" />
                    <button id="home-browse" class="ghost">浏览…</button>
                  </div>
                </div>
              </div>

              <div class="toolbar">
                <button id="home-go" class="primary">导出 dshhome</button>
                <span id="home-busy" class="muted" hidden>正在导出…</span>
              </div>
            </div>

            <aside id="home-preview" class="panel">
              <p class="muted">选择 DSH_HOME 后显示打包预览</p>
            </aside>
          </div>

          <div id="home-result" class="result" hidden></div>
          </div><!-- /export-home-view -->
        </section>

        <!-- 整合包（查看 + 导入） -->
        <section id="pane-pack" class="pane" hidden>
          <div class="pane-head">
            <div>
              <h1>整合包</h1>
              <p class="sub">打开 .dspack 查看内容并安装</p>
            </div>
          </div>

          <!-- 文件选择 -->
          <div class="panel form">
            <div class="field">
              <label for="pack-source">整合包</label>
              <div class="row">
                <input id="pack-source" placeholder="本地 .dspack 路径或 URL" />
                <button id="pack-browse" class="ghost">浏览…</button>
              </div>
            </div>
          </div>

          <!-- 包预览（选完文件后自动加载） -->
          <div id="pack-preview" class="panel" hidden>
            <div id="pack-preview-out"></div>
          </div>

          <!-- 安装区 -->
          <div id="pack-install" hidden>
            <div class="sub-tabs">
              <button data-install-tab="profile" class="active">导入 Profile</button>
              <button data-install-tab="home">导入 DSH_HOME</button>
            </div>
            <div id="install-profile-view">
              <div class="panel form">
                <div class="field">
                  <label for="import-name">安装名（覆盖 manifest）</label>
                  <input id="import-name" placeholder="可选" />
                </div>
                <div class="field">
                  <label for="import-root">目标根</label>
                  <input id="import-root" placeholder="默认 ~/.dsh/profiles" />
                </div>
                <label class="field check"><span><input type="checkbox" id="import-dry" /> 仅预览（dry-run）</span></label>
                <div class="toolbar"><button id="import-go" class="primary">安装</button></div>
              </div>
              <pre id="import-out" class="result"></pre>
            </div>
            <div id="install-home-view" hidden>
              <div class="panel form">
                <div class="field">
                  <label for="import-home-target">目标 DSH_HOME</label>
                  <input id="import-home-target" placeholder="默认 ~/.dsh" />
                </div>
                <label class="field check"><span><input type="checkbox" id="import-home-dry" /> 仅预览（dry-run）</span></label>
                <div class="toolbar"><button id="import-home-go" class="primary">安装</button></div>
              </div>
              <pre id="import-home-out" class="result"></pre>
            </div>
          </div>
        </section>
      </main>

      <footer id="status" class="status"></footer>
    </div>
  </div>

  <script>
    (function () {
      var root = document.documentElement;
      var KEY = 'dsh-packforge-theme';
      var saved = null;
      try { saved = localStorage.getItem(KEY); } catch (e) {}
      var initial = saved
        || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
      root.setAttribute('data-theme', initial);
      var btn = document.getElementById('theme-toggle');
      function label() { btn.textContent = root.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙'; }
      label();
      btn.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem(KEY, next); } catch (e) {}
        label();
      });
    })();
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
